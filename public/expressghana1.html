<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — Development in Progress</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, #253b80 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #6d1f68 0, transparent 35%),
        linear-gradient(135deg, #070b18, #11182e);
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(1100px, 90%);
      padding: 60px 30px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 30px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 10rem);
      line-height: .85;
      letter-spacing: -.07em;
      font-weight: 900;
      margin-bottom: 35px;
    }

    h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,.65);
    }

    .subtitle {
      max-width: 680px;
      margin: 0 auto 45px;
      color: rgba(255,255,255,.7);
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 1.7;
    }

    .progress {
      width: min(600px, 100%);
      height: 6px;
      margin: 0 auto 18px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,.12);
    }

    .progress::after {
      content: "";
      display: block;
      width: 68%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6c63ff, #c855ff);
      box-shadow: 0 0 20px rgba(145,90,255,.8);
      animation: progress 3s ease-in-out infinite alternate;
    }

    .status {
      color: rgba(255,255,255,.45);
      font-size: .8rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .orb {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .25;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      top: -150px;
      left: -100px;
      background: #4d6cff;
    }

    .orb.two {
      right: -100px;
      bottom: -150px;
      background: #d63cff;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -25px); }
    }

    @keyframes progress {
      from { width: 55%; }
      to { width: 75%; }
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      .badge {
        margin-bottom: 22px;
      }

      .subtitle {
        margin-bottom: 35px;
      }
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="container">
    <div class="badge">Development in Progress</div>

    <h1>
      Coming
      <span>Soon.</span>
    </h1>

    <p class="subtitle">
      We're building something new behind the scenes.
      The site is currently under development and will be
      launching soon.
    </p>

    <div class="progress"></div>
    <div class="status">Currently under construction</div>
  </main>
</body>
</html>
